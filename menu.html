<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
:root{--purple:#2a155f;--accent:#5630e8;--bg:#f1f1f1;--line:#e9e9e9}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#454545;background:var(--bg)}
.phone{width:100%;max-width:430px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:112px}
.status{height:76px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:20px 28px 0;font-size:17px;font-weight:600}
.status .right{display:flex;gap:8px;align-items:center}.battery{border:1.5px solid white;border-radius:5px;padding:1px 5px;font-size:14px}
.topbar{height:72px;background:var(--purple);color:white;display:flex;align-items:center;justify-content:center;position:relative;font-size:18px;font-weight:600}
.logoff{position:absolute;right:13px;border:1px solid #4b367e;border-radius:30px;padding:10px 16px;font-weight:400;font-size:16px}
main{padding:8px 15px 0}.group{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:8px}
.item{height:68px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #eee;font-size:17px;gap:13px}.item:last-child{border-bottom:0}
.ico{width:22px;height:25px;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chev{margin-left:auto;color:var(--accent);font-size:30px;font-weight:300;line-height:1}
.open-account{background:#fff;border-radius:14px;padding:20px 16px;margin-top:8px;font-size:17px;height:68px;display:flex;align-items:center}
.legal{text-align:center;color:var(--accent);font-size:13px;margin:16px 0 0;white-space:nowrap}
.bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(92%,400px);height:62px;border:1px solid #d0d0d0;border-radius:40px;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:space-around;box-shadow:0 3px 12px #00000008}
.nav{height:54px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;font-size:10px;gap:3px}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}.nav.active{background:#e8e6ed;border-radius:35px;color:var(--accent);height:54px}
@media(min-width:600px){.phone{box-shadow:0 0 20px #ddd}.bottom{position:absolute;bottom:20px}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>08:17 ◢</span><span class="right">●●● ◉ <span class="battery">87</span></span></div>
  <header class="topbar">Menu <span class="logoff">Log off</span></header>
  <main>
    <section class="group">
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg></span>Alerts<span class="chev">›</span></div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 2h16v20H4zM8 7l4-2 4 2M8 13h8M8 16h8M8 19h8"/></svg></span>Documents<span class="chev">›</span></div>
    </section>
    <section class="group"><div class="item"><span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14"/><path d="M5 10h14M5 14h7M5 17h10"/></svg></span>Check deposit<span class="chev">›</span></div></section>
    <section class="group">
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 21c0-5 3-8 9-8s9 3 9 8z"/></svg></span>My profile<span class="chev">›</span></div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5l2 1.5-2 3-2.5-1-2 1-0.5 2.5h-4L9 18l-2-1-2.5 1-2-3 2-1.5v-3L2.5 9l2-3L7 7l2-1 0.5-2.5h4L14 6l2 1 2.5-1 2 3-2 1.5z"/></svg></span>Settings<span class="chev">›</span></div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2 3h20v15H8l-5 4v-4H2zM5 7h14M5 11h14M5 15h9"/></svg></span>Customer service<span class="chev">›</span></div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8 15c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7zM12 1V0M3 4 1 2M21 4l2-2M2 11H0M22 11h2"/></svg></span>Knowledge base<span class="chev">›</span></div>
    </section>
    <div class="open-account">Open account</div>
    <div class="legal">Disclosures&nbsp; | End-user license agreement&nbsp; | Privacy policy</div>
  </main>
  <nav class="bottom">
    <div class="nav"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20"/><path d="M8 7h8M8 12h8M8 17h8"/></svg>Accounts</div>
    <div class="nav"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18M8 3v4M16 10v4M8 17v4"/></svg>Watch Lists</div>
    <div class="nav"><svg viewBox="0 0 24 24"><path d="M3 7h17l-5-5M21 17H4l5 5"/></svg>Trade</div>
    <div class="nav"><svg viewBox="0 0 24 24"><path d="M2 3h20v18H2zM5 16l4-5 4 3 6-8"/></svg>Markets</div>
    <div class="nav active"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>Menu</div>
  </nav>
</div>
</body>
</html>
